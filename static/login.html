<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Sign in · SmartMailer AI</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #eef2ff; background: radial-gradient(circle at 20% 0, #243c91 0, transparent 32rem), radial-gradient(circle at 100% 100%, #254b65 0, transparent 30rem), #080d1d; }
    main { width: min(430px, calc(100% - 32px)); padding: 34px; border: 1px solid rgba(150,170,235,.2); border-radius: 20px; background: rgba(17,27,57,.82); box-shadow: 0 30px 90px rgba(0,0,0,.35); backdrop-filter: blur(18px); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .mark { width: 42px; height: 42px; display: grid; place-items: center; border-radius: 12px; font-weight: 900; background: linear-gradient(145deg,#32bdf2,#7067ef); box-shadow: 0 10px 25px rgba(76,100,232,.35); }
    .brand strong, .brand small { display: block; } .brand small { margin-top: 2px; color: #94a1c6; font-size: 11px; }
    p.eyebrow { margin: 0; color: #7f91d8; font-size: 10px; font-weight: 850; letter-spacing: 1.8px; text-transform: uppercase; }
    h1 { margin: 6px 0 8px; font-size: 30px; letter-spacing: -1.2px; } .intro { margin: 0 0 25px; color: #aab5d4; }
    label { display: block; margin: 0 0 16px; color: #c8d0e8; font-size: 12px; font-weight: 750; }
    input { width: 100%; margin-top: 7px; padding: 12px 13px; color: white; border: 1px solid #35446f; border-radius: 9px; outline: 0; background: #0d1630; font: inherit; }
    input:focus { border-color: #7181ee; box-shadow: 0 0 0 3px rgba(90,113,239,.16); }
    button { width: 100%; margin-top: 4px; padding: 12px 15px; border: 0; border-radius: 9px; color: white; background: linear-gradient(135deg,#4b63e8,#715fe9); font: 750 14px inherit; cursor: pointer; box-shadow: 0 10px 25px rgba(75,99,232,.25); }
    button:disabled { opacity: .65; cursor: wait; } #message { min-height: 21px; margin: 13px 0 0; color: #ff9db2; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="mark">S</span><span><strong>SmartMailer</strong><small>Secure sending studio</small></span></div>
    <p class="eyebrow">Protected workspace</p>
    <h1>Welcome back.</h1>
    <p class="intro">Sign in to continue to the SmartSender dashboard.</p>
    <form id="loginForm">
      <label>Username<input name="username" autocomplete="username" required autofocus></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in securely</button>
      <p id="message" role="alert"></p>
    </form>
  </main>
  <script>
    document.querySelector("#loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const button = event.currentTarget.querySelector("button");
      const message = document.querySelector("#message");
      const form = new FormData(event.currentTarget);
      button.disabled = true; message.textContent = "";
      try {
        const response = await fetch("/auth/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: form.get("username"), password: form.get("password") }) });
        if (!response.ok) throw new Error("Invalid username or password.");
        location.replace("/");
      } catch (error) { message.textContent = error.message; button.disabled = false; }
    });
  </script>
</body>
</html>
